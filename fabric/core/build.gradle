architectury {
    platformSetupLoomIde()
    fabric()
}

apply from: rootProject.file("gradle/scripts/platform.gradle")
apply from: rootProject.file("gradle/scripts/publishing.gradle")
apply from: rootProject.file("gradle/scripts/maven-publishing.gradle")

base {
    archivesName = "${rootProject.archives_base_name}-fabric"
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    common(project(path: ':common-core', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common-core', configuration: 'transformProductionFabric')

    common(project(path: ':fabric-networking', configuration: 'namedElements')) { transitive = false }
    shadowBundle(project(path: ':fabric-networking', configuration: 'namedElements')) { transitive = false }

    common(project(path: ':fabric-events', configuration: 'namedElements')) { transitive = false }
    shadowBundle(project(path: ':fabric-events', configuration: 'namedElements')) { transitive = false }

    common(project(path: ':fabric-registry', configuration: 'namedElements')) { transitive = false }
    shadowBundle(project(path: ':fabric-registry', configuration: 'namedElements')) { transitive = false }

    modCompileOnly "me.lucko:fabric-permissions-api:${fabric_permissions_api_version}"
}