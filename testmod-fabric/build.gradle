plugins {
    id 'multiloader-common'
    id 'net.fabricmc.fabric-loom'
}

configurations {
    moduleJava { canBeResolved = true }
    moduleResources { canBeResolved = true }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    implementation project(':fabric-core')

    compileOnly(project(':testmod-common')) {
        attributes { attribute(Attribute.of('io.github.mcgradleconventions.loader', String), 'common') }
    }
    moduleJava project(path: ':testmod-common', configuration: 'moduleJava')
    moduleResources project(path: ':testmod-common', configuration: 'moduleResources')
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.moduleJava)
    source(configurations.moduleJava)
}

processResources {
    dependsOn(configurations.moduleResources)
    from(configurations.moduleResources)
}

loom {
    // Utilize the main mod's access widener for the test environment
    def aw = project(':common-core').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Test Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Test Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named("$variant") { attributes { attribute(loaderAttribute, 'fabric') } }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") { attributes { attribute(loaderAttribute, 'fabric') } }
    }
}