plugins {
    id 'java-library'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
}

configurations {
    moduleJava { canBeResolved = false; canBeConsumed = true }
    moduleResources { canBeResolved = false; canBeConsumed = true }
}

artifacts {
    moduleJava sourceSets.main.java.sourceDirectories.singleFile
}

afterEvaluate {
    sourceSets.main.resources.srcDirs.each { dir ->
        artifacts.add('moduleResources', dir)
    }
}

repositories {
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
}