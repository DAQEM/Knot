modLoader = "javafml"
loaderVersion = "[1,)"
issueTrackerURL = "${mod_repository}/issues"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
license = "${mod_license}"
displayName = "${mod_name}"
authors = "${mod_author}"
credits = "${mod_author}"
description = "${mod_description}"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version},)"
ordering = "NONE"
side = "BOTH"

[[mixins]]
config = "knot-api.mixins.json"

[[mixins]]
config = "knot-core.mixins.json"

[[mixins]]
config = "knot-events.mixins.json"

[[mixins]]
config = "knot-registry.mixins.json"

[[mixins]]
config = "knot-events-neoforge.mixins.json"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"
