architectury {
    platformSetupLoomIde()
    neoForge()
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

    implementation project(path: ":common-api", configuration: "namedElements")
    implementation project(path: ":common-core", configuration: "namedElements")
    implementation project(path: ":common-events", configuration: "namedElements")

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.3"))
    implementation(include("io.github.llamalad7:mixinextras-forge:0.5.3"))
}