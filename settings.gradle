pluginManagement {
    repositories {
        maven { url "https://maven.minecraftforge.net/" }
        maven { url "https://maven.neoforged.net/releases/" }
        maven { url "https://maven.shedaniel.me/" }
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.fabricmc')
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

include("common-api")
project(":common-api").projectDir = file("common/api")

include("common-core")
project(":common-core").projectDir = file("common/core")

include("common-networking")
project(":common-networking").projectDir = file("common/networking")

include("common-events")
project(":common-events").projectDir = file("common/events")

include("common-registry")
project(":common-registry").projectDir = file("common/registry")

include("fabric-core")
project(":fabric-core").projectDir = file("fabric/core")

include("fabric-networking")
project(":fabric-networking").projectDir = file("fabric/networking")

include("fabric-events")
project(":fabric-events").projectDir = file("fabric/events")

include("fabric-registry")
project(":fabric-registry").projectDir = file("fabric/registry")

include("neoforge-core")
project(":neoforge-core").projectDir = file("neoforge/core")

include("neoforge-networking")
project(":neoforge-networking").projectDir = file("neoforge/networking")

include("neoforge-events")
project(":neoforge-events").projectDir = file("neoforge/events")

include("neoforge-registry")
project(":neoforge-registry").projectDir = file("neoforge/registry")

include("testmod-common")
include("testmod-fabric")
include("testmod-neoforge")

rootProject.name = "Knot 26.1.2"