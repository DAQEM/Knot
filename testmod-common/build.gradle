// Give the testmod a unique jar name to prevent Architectury Transformer crashes
base {
    archivesName = "${rootProject.archives_base_name}-testmod-common"
}

architectury {
    common(rootProject.enabled_platforms.split(","))
}

loom {
    accessWidenerPath = project(':common').file("src/main/resources/${rootProject.mod_id}.accesswidener")
}

dependencies {
    modCompileOnly "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    implementation project(path: ":common", configuration: "namedElements")
}