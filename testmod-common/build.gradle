base {
    archivesName = "${rootProject.archives_base_name}-testmod-common"
}

architectury {
    common(rootProject.enabled_platforms.split(","))
}

loom { accessWidenerPath = rootProject.project(":common-core").file("src/main/resources/${rootProject.mod_id}.accesswidener") }

dependencies {
    modCompileOnly "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

    implementation project(path: ":common-api", configuration: "namedElements")
    implementation project(path: ":common-core", configuration: "namedElements")
    implementation project(path: ":common-networking", configuration: "namedElements")
    implementation project(path: ":common-events", configuration: "namedElements")
    implementation project(path: ":common-registry", configuration: "namedElements")
}